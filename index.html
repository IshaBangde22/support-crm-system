<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <div class="max-w-7xl mx-auto px-4 py-6">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">Customer Support CRM</h1>
      <p class="text-slate-600">Create, search, filter, and update customer support tickets.</p>
    </header>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white rounded-2xl shadow p-5">
        <h2 class="text-xl font-semibold mb-4">Create Ticket</h2>
        <form id="ticketForm" class="space-y-3">
          <input id="customerName" class="w-full border rounded-lg px-3 py-2" placeholder="Customer name" required />
          <input id="customerEmail" type="email" class="w-full border rounded-lg px-3 py-2" placeholder="Customer email" required />
          <input id="subject" class="w-full border rounded-lg px-3 py-2" placeholder="Issue title / subject" required />
          <textarea id="description" class="w-full border rounded-lg px-3 py-2" rows="4" placeholder="Issue description" required></textarea>
          <button class="w-full bg-slate-900 text-white rounded-lg py-2 font-medium hover:bg-slate-700">
            Create Ticket
          </button>
        </form>
        <p id="formMessage" class="mt-3 text-sm"></p>
      </div>

      <div class="lg:col-span-2 space-y-4">
        <div class="bg-white rounded-2xl shadow p-5">
          <div class="flex flex-col md:flex-row gap-3">
            <input id="searchInput" class="flex-1 border rounded-lg px-3 py-2" placeholder="Search by ID, name, email, subject, description..." />
            <select id="statusFilter" class="border rounded-lg px-3 py-2">
              <option value="">All Status</option>
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead class="bg-slate-900 text-white">
                <tr>
                  <th class="p-3">ID</th>
                  <th class="p-3">Customer</th>
                  <th class="p-3">Title</th>
                  <th class="p-3">Status</th>
                  <th class="p-3">Date</th>
                </tr>
              </thead>
              <tbody id="ticketTable"></tbody>
            </table>
          </div>
          <p id="emptyMessage" class="hidden p-5 text-slate-500">No tickets found.</p>
        </div>
      </div>
    </section>

    <section id="detailSection" class="hidden mt-6 bg-white rounded-2xl shadow p-5">
      <div class="flex justify-between gap-4 flex-col md:flex-row">
        <div>
          <h2 class="text-2xl font-bold" id="detailSubject"></h2>
          <p class="text-slate-600" id="detailMeta"></p>
        </div>
        <span id="detailStatus" class="h-fit px-3 py-1 rounded-full text-sm font-semibold"></span>
      </div>

      <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <h3 class="font-semibold">Customer Details</h3>
          <p id="detailCustomer"></p>
        </div>
        <div>
          <h3 class="font-semibold">Description</h3>
          <p id="detailDescription" class="text-slate-700"></p>
        </div>
      </div>

      <div class="mt-5 border-t pt-5">
        <h3 class="font-semibold mb-3">Update Ticket</h3>
        <div class="flex flex-col md:flex-row gap-3">
          <select id="updateStatus" class="border rounded-lg px-3 py-2">
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Closed">Closed</option>
          </select>
          <input id="noteText" class="flex-1 border rounded-lg px-3 py-2" placeholder="Add note/comment" />
          <button id="updateBtn" class="bg-slate-900 text-white rounded-lg px-5 py-2 hover:bg-slate-700">Update</button>
        </div>
      </div>

      <div class="mt-5">
        <h3 class="font-semibold mb-2">Notes</h3>
        <div id="notesList" class="space-y-2"></div>
      </div>
    </section>
  </div>

  <script>
    let selectedTicketId = null;

    const ticketTable = document.getElementById("ticketTable");
    const emptyMessage = document.getElementById("emptyMessage");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");

    function formatDate(value) {
      return new Date(value).toLocaleString();
    }

    function badgeClass(status) {
      if (status === "Closed") return "bg-green-100 text-green-800";
      if (status === "In Progress") return "bg-yellow-100 text-yellow-800";
      return "bg-blue-100 text-blue-800";
    }

    async function loadTickets() {
      const params = new URLSearchParams();
      if (searchInput.value.trim()) params.append("search", searchInput.value.trim());
      if (statusFilter.value) params.append("status", statusFilter.value);

      const res = await fetch(`/api/tickets?${params.toString()}`);
      const tickets = await res.json();

      ticketTable.innerHTML = "";
      emptyMessage.classList.toggle("hidden", tickets.length !== 0);

      tickets.forEach(ticket => {
        const row = document.createElement("tr");
        row.className = "border-b hover:bg-slate-50 cursor-pointer";
        row.innerHTML = `
          <td class="p-3 font-medium">${ticket.ticket_id}</td>
          <td class="p-3">${ticket.customer_name}</td>
          <td class="p-3">${ticket.subject}</td>
          <td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${badgeClass(ticket.status)}">${ticket.status}</span></td>
          <td class="p-3">${formatDate(ticket.created_at)}</td>
        `;
        row.addEventListener("click", () => loadTicketDetail(ticket.ticket_id));
        ticketTable.appendChild(row);
      });
    }

    async function loadTicketDetail(ticketId) {
      selectedTicketId = ticketId;
      const res = await fetch(`/api/tickets/${ticketId}`);
      const ticket = await res.json();

      document.getElementById("detailSection").classList.remove("hidden");
      document.getElementById("detailSubject").textContent = `${ticket.ticket_id} - ${ticket.subject}`;
      document.getElementById("detailMeta").textContent = `Created: ${formatDate(ticket.created_at)} | Updated: ${formatDate(ticket.updated_at)}`;
      document.getElementById("detailStatus").textContent = ticket.status;
      document.getElementById("detailStatus").className = `h-fit px-3 py-1 rounded-full text-sm font-semibold ${badgeClass(ticket.status)}`;
      document.getElementById("detailCustomer").textContent = `${ticket.customer_name} (${ticket.customer_email})`;
      document.getElementById("detailDescription").textContent = ticket.description;
      document.getElementById("updateStatus").value = ticket.status;

      const notesList = document.getElementById("notesList");
      notesList.innerHTML = "";
      if (ticket.notes.length === 0) {
        notesList.innerHTML = `<p class="text-slate-500">No notes yet.</p>`;
      } else {
        ticket.notes.forEach(note => {
          const div = document.createElement("div");
          div.className = "border rounded-lg p-3 bg-slate-50";
          div.innerHTML = `<p>${note.note_text}</p><p class="text-xs text-slate-500 mt-1">${formatDate(note.created_at)}</p>`;
          notesList.appendChild(div);
        });
      }

      document.getElementById("detailSection").scrollIntoView({ behavior: "smooth" });
    }

    document.getElementById("ticketForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        customer_name: document.getElementById("customerName").value,
        customer_email: document.getElementById("customerEmail").value,
        subject: document.getElementById("subject").value,
        description: document.getElementById("description").value
      };

      const res = await fetch("/api/tickets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const message = document.getElementById("formMessage");

      if (res.ok) {
        const data = await res.json();
        message.textContent = `Ticket created successfully: ${data.ticket_id}`;
        message.className = "mt-3 text-sm text-green-700";
        e.target.reset();
        loadTickets();
      } else {
        message.textContent = "Please check all fields and try again.";
        message.className = "mt-3 text-sm text-red-700";
      }
    });

    document.getElementById("updateBtn").addEventListener("click", async () => {
      if (!selectedTicketId) return;

      const payload = {
        status: document.getElementById("updateStatus").value,
        notes: document.getElementById("noteText").value
      };

      const res = await fetch(`/api/tickets/${selectedTicketId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        document.getElementById("noteText").value = "";
        await loadTickets();
        await loadTicketDetail(selectedTicketId);
      }
    });

    let searchTimer;
    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadTickets, 300);
    });

    statusFilter.addEventListener("change", loadTickets);
    loadTickets();
  </script>
</body>
</html>
